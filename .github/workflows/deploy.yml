name: Deploy MLflow
on:
  push:
    branches: [ main ]
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: npm install -g aws-cdk
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::579035388785:role/mlflow-github-role
          aws-region: ap-south-1
      - id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - run: |
          docker build -t mlflow-server:latest ./container
          docker tag mlflow-server:latest ${{ steps.login-ecr.outputs.registry }}/mlflow-server:latest
          docker push ${{ steps.login-ecr.outputs.registry }}/mlflow-server:latest
      - run: cdk deploy --require-approval never